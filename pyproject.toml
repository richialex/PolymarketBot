[project]
name = "polymarketfarm"
version = "0.1.0"
description = "Polymarket LP rewards farming bot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "polymarket-client>=0.1.0b1",
    "apscheduler>=3.10.4",
    "aiosqlite>=0.20.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "websockets>=13.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
